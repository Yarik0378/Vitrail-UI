<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="menu.css"></head>
<body>
  <main class="menu">
    <h1>Northwind</h1>
    <nav>
      <button data-action="play">New game</button>
      <button data-action="load">Continue</button>
      <button data-action="settings" id="open-settings">Settings</button>
      <button data-action="quit">Quit</button>
    </nav>
    <section class="settings" hidden>
      <label>Resolution
        <select id="resolution">
          <option value="1280x720">1280 × 720</option>
          <option value="1920x1080" selected>1920 × 1080</option>
          <option value="2560x1440">2560 × 1440</option>
          <option value="3840x2160">3840 × 2160</option>
        </select>
      </label>
      <label>Player name <input id="name" value="Wanderer"></label>
      <label class="check"><input type="checkbox" id="vsync" checked> V-sync</label>
      <button id="back">Back</button>
    </section>
    <p class="hint">Mouse, keyboard (Tab, Enter) or a gamepad (d-pad, A, B)</p>
  </main>
  <script>
    const settings = document.querySelector('.settings');
    document.getElementById('open-settings').addEventListener('click', () => { settings.toggleAttribute('hidden', false); document.getElementById('resolution').focus(); });
    document.getElementById('back').addEventListener('click', () => { settings.toggleAttribute('hidden', true); });
    document.getElementById('resolution').addEventListener('change', (e) => engine.trigger('resolution', e.target.value));
    document.getElementById('name').addEventListener('input', (e) => engine.trigger('name', e.target.value));
  </script>
</body></html>
