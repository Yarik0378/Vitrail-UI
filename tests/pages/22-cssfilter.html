<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { display: flex; flex-wrap: wrap; gap: 24px; padding: 20px; width: 760px; }
.b { width: 100px; height: 60px; border-radius: 10px; background: linear-gradient(135deg, #e0a050, #3a8a70 60%, #1d3a60);
  box-shadow: inset 0 0 0 2px #f4e8c8; color: #fff; font: 700 15px/60px sans-serif; text-align: center; }
.blur { filter: blur(4px); }
.shadow { filter: drop-shadow(0 6px 6px rgba(0,0,0,.6)); }
.gray { filter: grayscale(1); }
.bright { filter: brightness(1.6); }
.sat { filter: saturate(2.5); }
.hue { filter: hue-rotate(120deg); }
.inv { filter: invert(1); }
.sepia { filter: sepia(1); }
.contrast { filter: contrast(2); }
.op { filter: opacity(.4); }
.combo { filter: grayscale(.6) drop-shadow(4px 4px 0 #b04030) blur(1px); }
.round { width: 60px; border-radius: 50%; filter: drop-shadow(0 0 8px #ffd070); }
</style></head><body>
<div class="b blur">blur</div><div class="b shadow">shadow</div><div class="b gray">gray</div><div class="b bright">bright</div>
<div class="b sat">sat</div><div class="b hue">hue</div><div class="b inv">inv</div><div class="b sepia">sepia</div>
<div class="b contrast">contrast</div><div class="b op">opacity</div><div class="b combo">combo</div><div class="b round">o</div>
</body></html>
