<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#1e3530}
.ring{position:absolute;top:10px;width:60px;height:60px;border-radius:50%;--p:40%;--ring:#e9bd5c;
  background:radial-gradient(circle at 50% 32%,rgba(29,52,47,.85),rgba(15,28,26,.9) 68%);
  box-shadow:inset 0 0 0 2px #110f0e,inset 0 0 0 3px #5b7d74,inset 0 3px 6px rgba(0,0,0,.7)}
.a{left:10px}
.b{left:90px;box-shadow:inset 0 0 0 3px #5b7d74}
.c{left:170px;box-shadow:inset 0 0 0 2px #110f0e,inset 0 0 0 3px #5b7d74}
.d{left:250px;border-radius:12px;box-shadow:inset 0 0 0 2px #110f0e,inset 0 0 0 3px #5b7d74}
.p{position:absolute;inset:3px;border-radius:50%;background:conic-gradient(var(--ring) 0 var(--p),transparent var(--p));
  mask:radial-gradient(circle,transparent 22px,#000 22.5px,#000 24.5px,transparent 25px)}
</style></head><body><div class="ring a"><div class="p"></div></div><div class="ring b"></div><div class="ring c"></div><div class="ring d"></div></body></html>
