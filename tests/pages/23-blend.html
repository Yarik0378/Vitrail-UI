<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; width: 780px; }

  background: linear-gradient(90deg, #203a30, #d8b060 50%, #f4f0e0), #000; }
.t { position: absolute; left: 20px; top: 12px; width: 100px; height: 46px; border-radius: 23px;
  background: linear-gradient(180deg, rgba(60,140,200,.9), rgba(200,60,90,.7)); }
span { position: absolute; left: 6px; bottom: 2px; font: 10px sans-serif; color: #000; }
</style></head><body><div class="c"><div class="t" style="mix-blend-mode:multiply"></div><span>multiply</span></div><div class="c"><div class="t" style="mix-blend-mode:screen"></div><span>screen</span></div><div class="c"><div class="t" style="mix-blend-mode:overlay"></div><span>overlay</span></div><div class="c"><div class="t" style="mix-blend-mode:darken"></div><span>darken</span></div><div class="c"><div class="t" style="mix-blend-mode:lighten"></div><span>lighten</span></div><div class="c"><div class="t" style="mix-blend-mode:color-dodge"></div><span>color-dodge</span></div><div class="c"><div class="t" style="mix-blend-mode:color-burn"></div><span>color-burn</span></div><div class="c"><div class="t" style="mix-blend-mode:hard-light"></div><span>hard-light</span></div><div class="c"><div class="t" style="mix-blend-mode:soft-light"></div><span>soft-light</span></div><div class="c"><div class="t" style="mix-blend-mode:difference"></div><span>difference</span></div><div class="c"><div class="t" style="mix-blend-mode:exclusion"></div><span>exclusion</span></div><div class="c"><div class="t" style="mix-blend-mode:hue"></div><span>hue</span></div><div class="c"><div class="t" style="mix-blend-mode:saturation"></div><span>saturation</span></div><div class="c"><div class="t" style="mix-blend-mode:color"></div><span>color</span></div><div class="c"><div class="t" style="mix-blend-mode:luminosity"></div><span>luminosity</span></div></body></html>
