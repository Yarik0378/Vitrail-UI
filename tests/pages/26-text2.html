<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
@font-face { font-family: GameSans; src: url(fonts/AlegreyaSans-Bold.ttf); font-weight: 700; }
body { position: relative; width: 800px; height: 300px; color: #f4ead0; font: 700 18px GameSans; }
div { position: absolute; white-space: nowrap; }
.big { left: 10px; top: -30px; font-size: 220px; color: #4e7068; }
.emoji { left: 20px; top: 210px; font-size: 32px; font-family: sans-serif; }
.cjk { left: 300px; top: 20px; font-size: 26px; font-family: sans-serif; }
.cyr { left: 300px; top: 70px; font-size: 22px; }
.rot { left: 560px; top: 150px; font-size: 24px; transform: rotate(-20deg); }
.scale { left: 300px; top: 130px; font-size: 16px; transform: scale(1.8); transform-origin: 0 0; }
.grad { left: 300px; top: 230px; font-size: 40px; background: linear-gradient(90deg, #f4d080, #c05040); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head><body>
<div class="big">Ag</div>
<div class="emoji">🏰 ⚔️ 🌾 👑</div>
<div class="cjk">文明 · 帝国 · 日本語</div>
<div class="cyr">Їжак ґанок «Щастя» — 1234</div>
<div class="rot">Повернутий текст</div>
<div class="scale">Збільшений ×1.8</div>
<div class="grad">Градієнт</div>
</body></html>
