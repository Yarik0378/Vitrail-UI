<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>html { background: #20302c; }
body { position: relative; width: 800px; height: 240px; font: 700 20px sans-serif; }
.stripes { position: absolute; left: 20px; top: 20px; width: 760px; height: 200px;
  background: repeating-linear-gradient(90deg, #e0a050 0 20px, #3a8a70 20px 40px, #f4ead0 40px 60px, #c05040 60px 80px); }
.dot { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: #2a5ab0; }
.glass { position: absolute; top: 60px; width: 200px; height: 120px; border-radius: 18px; background: rgba(20, 40, 36, .25);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); color: #fff; text-align: center; line-height: 120px; }
.g1 { left: 40px; backdrop-filter: blur(6px); }
.g2 { left: 300px; backdrop-filter: blur(3px) saturate(1.8); }
.g3 { left: 560px; backdrop-filter: grayscale(1) brightness(.7); }
</style></head><body>
<div class="stripes"></div><div class="dot" style="left:120px;top:40px"></div><div class="dot" style="left:380px;top:130px"></div>
<div class="glass g1">blur</div><div class="glass g2">sat</div><div class="glass g3">gray</div>
</body></html>
