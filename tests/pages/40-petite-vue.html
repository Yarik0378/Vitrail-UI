<!doctype html>
<html><head><meta charset="utf-8">
<!-- petite-vue unchanged (vendor/): reactive text, v-for, v-if, @click, :class, v-model-free state, the engine bridge. -->
<style>
  body { margin: 0; font: 16px/1.3 sans-serif; color: #f6eedc; background: #122722; }
  .app { padding: 16px; display: flex; flex-direction: column; gap: 10px; width: 360px; }
  button { font: inherit; color: inherit; background: #2a4a43; border: 1px solid #6f9488; border-radius: 6px; padding: 6px 12px; }
  li.done { text-decoration: line-through; color: #8fa49c; }
  .big { font-size: 28px; font-weight: bold; }
</style></head>
<body>
<div class="app" v-scope>
  <div id="count" class="big">{{ count }}</div>
  <button id="inc" @click="inc">+1</button>
  <ul id="list"><li v-for="t in todos" :key="t.name" :class="{ done: t.done }" @click="t.done = !t.done">{{ t.name }}</li></ul>
  <div id="even" v-if="count % 2 === 0">even</div>
  <div id="odd" v-else>odd</div>
</div>
<script src="vendor/petite-vue-0.4.1.iife.js"></script>
<script>
  // In a browser (Chrome references) there is no game: a stand-in for its bridge.
  window.engine ??= { on() {}, off() {}, trigger() {} };
  // A reactive list the game adds to (petite-vue's own `reactive`).
  const todos = PetiteVue.reactive([{ name: 'wood', done: false }, { name: 'stone', done: true }, { name: 'iron', done: false }]);
  engine.on('add', (name) => todos.push({ name, done: false }));
  PetiteVue.createApp({
    count: 0,
    todos,
    inc() { this.count++; engine.trigger('count', this.count); },
  }).mount();
  engine.trigger('mounted');
</script>
</body></html>
